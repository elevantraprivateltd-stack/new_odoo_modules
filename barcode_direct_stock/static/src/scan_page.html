<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Quick Barcode Scan</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111}
  .wrap{max-width:560px;margin:0 auto;padding:12px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .top a{color:#555;text-decoration:none;font-size:14px}
  h1{font-size:18px;margin:0}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .mode{padding:18px 0;font-size:20px;font-weight:700;border:3px solid transparent;border-radius:14px;background:#e5e7eb;color:#555;cursor:pointer}
  .mode.in.active{background:#16a34a;color:#fff;border-color:#166534}
  .mode.out.active{background:#dc2626;color:#fff;border-color:#991b1b}
  .card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .row{display:flex;gap:8px;align-items:center}
  input[type=text],input[type=number]{font-size:20px;padding:12px;border:2px solid #d1d5db;border-radius:10px;width:100%}
  input[type=number]{width:90px;text-align:center}
  button{font-size:16px;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}
  .primary{background:#2563eb;color:#fff}
  .cam{width:100%;background:#111;color:#fff;margin-top:8px;font-size:18px;padding:14px}
  #reader{width:100%;margin-top:8px;display:none}
  #result{min-height:84px;border-radius:14px;padding:14px;font-size:18px;font-weight:600;background:#e5e7eb;color:#444;margin-bottom:12px}
  #result.ok{background:#dcfce7;color:#14532d}
  #result.err{background:#fee2e2;color:#7f1d1d}
  #result small{display:block;font-weight:400;margin-top:4px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td{padding:6px 4px;border-bottom:1px solid #eee}
  td.q{text-align:right;white-space:nowrap}
  .in-t{color:#16a34a;font-weight:700}.out-t{color:#dc2626;font-weight:700}
  .gone{text-decoration:line-through;color:#9ca3af}
  .undo{background:#f3f4f6;padding:4px 10px;font-size:13px}
  label.lbl{font-size:13px;color:#555}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Quick Barcode Scan</h1><a href="/odoo">&larr; Back to Odoo</a></div>

  <div class="modes">
    <button class="mode in" id="mIn">STOCK IN (+)</button>
    <button class="mode out" id="mOut">STOCK OUT (&minus;)</button>
  </div>

  <div id="result">Choose IN or OUT, then scan a barcode.</div>

  <div class="card">
    <div class="row">
      <input type="text" id="code" placeholder="Scan / type barcode, press Enter" autocomplete="off" inputmode="text" autofocus>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="lbl">Qty per scan</label>
      <input type="number" id="qty" value="1" min="1" step="1">
      <button class="primary" id="go" style="flex:1">Add</button>
    </div>
    <button class="cam" id="camBtn">&#128247; Scan with phone camera</button>
    <div id="reader"></div>
  </div>

  <div class="card">
    <b>Recent scans</b>
    <table id="recent"></table>
  </div>
</div>

<script src="/barcode_direct_stock/static/lib/html5-qrcode.min.js"></script>
<script>
let mode = localStorage.getItem('qs_mode') || '';
const $ = id => document.getElementById(id);
let busy = false, lastCode = '', lastTime = 0, scanner = null;

function setMode(m){
  mode = m; try{localStorage.setItem('qs_mode', m)}catch(e){}
  $('mIn').classList.toggle('active', m==='in');
  $('mOut').classList.toggle('active', m==='out');
}
$('mIn').onclick = () => { setMode('in'); $('code').focus(); };
$('mOut').onclick = () => { setMode('out'); $('code').focus(); };
setMode(mode);

async function rpc(url, params){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({jsonrpc:'2.0', method:'call', params: params||{}})});
  const j = await r.json();
  if (j.error) {
    if (j.error.code === 100) throw new Error('Session expired. Please log in to Odoo again.');
    throw new Error((j.error.data && j.error.data.message) || j.error.message);
  }
  return j.result;
}

function beep(ok){
  try{
    const c = new (window.AudioContext||window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(c.destination);
    g.gain.value = 0.15; o.start(); o.stop(c.currentTime + (ok ? 0.12 : 0.4));
  }catch(e){}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
}

function show(cls, html){ const r=$('result'); r.className=cls; r.innerHTML=html; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function submit(barcode){
  barcode = (barcode||'').trim();
  if (!barcode || busy) return;
  if (!mode) { show('err','Please choose STOCK IN or STOCK OUT first.'); beep(false); return; }
  busy = true;
  try{
    const res = await rpc('/quick_scan/scan', {barcode, mode, qty: parseFloat($('qty').value)||1});
    if (res.ok){
      beep(true);
      show('ok', (res.mode==='in' ? '+' : '&minus;') + res.qty + ' &nbsp;' + esc(res.product) +
        '<small>Now in stock: ' + res.on_hand + (res.notes.length ? '<br>' + res.notes.map(esc).join('<br>') : '') + '</small>');
    } else {
      beep(false); show('err', esc(res.message));
    }
  }catch(e){ beep(false); show('err', esc(e.message)); }
  busy = false;
  loadRecent();
}

$('code').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); const v=$('code').value; $('code').value=''; submit(v); }
});
$('go').onclick = () => { const v=$('code').value; $('code').value=''; submit(v); $('code').focus(); };

async function loadRecent(){
  try{
    const rows = await rpc('/quick_scan/recent');
    $('recent').innerHTML = rows.map(r =>
      '<tr class="' + (r.state==='reverted'?'gone':'') + '"><td>' + r.time + '</td>' +
      '<td>' + esc(r.product) + '</td>' +
      '<td class="q ' + (r.mode==='in'?'in-t':'out-t') + '">' + (r.mode==='in'?'+':'&minus;') + r.qty + '</td>' +
      '<td>' + (r.state==='done' ? '<button class="undo" data-id="'+r.id+'">Undo</button>' : '') + '</td></tr>'
    ).join('') || '<tr><td>No scans yet.</td></tr>';
  }catch(e){}
}
$('recent').addEventListener('click', async e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (!id) return;
  try{
    const res = await rpc('/quick_scan/undo', {log_id: id});
    if (res.ok){ beep(true); show('ok', 'Undone: ' + esc(res.product) + '<small>Now in stock: ' + res.on_hand + '</small>'); }
    else { beep(false); show('err', esc(res.message)); }
  }catch(err){ beep(false); show('err', esc(err.message)); }
  loadRecent();
});

// ---- phone camera ----
$('camBtn').onclick = async () => {
  const box = $('reader');
  if (scanner){
    try{ await scanner.stop(); scanner.clear(); }catch(e){}
    scanner = null; box.style.display='none'; $('camBtn').textContent = '\uD83D\uDCF7 Scan with phone camera'; return;
  }
  if (!window.isSecureContext){
    show('err', 'Camera needs a secure (https) address. Open this page using https://, or use a USB/Bluetooth scanner.');
    return;
  }
  box.style.display='block';
  scanner = new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'},
      {fps:10, qrbox:(w,h)=>({width:Math.min(w-20,320), height:Math.min(h-20,160)})},
      code => {
        const now = Date.now();
        if (code === lastCode && now - lastTime < 2000) return;   // same code in front of camera
        lastCode = code; lastTime = now;
        submit(code);
      }, () => {});
    $('camBtn').textContent = 'Stop camera';
  }catch(e){
    scanner = null; box.style.display='none';
    show('err', 'Cannot open camera: ' + esc(e));
  }
};

loadRecent();
</script>
</body>
</html>
